<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui; margin: 0; padding: 24px; background: #fff; color: #111; }
  .dark { background: #0b0b0f; color: #eee; margin: -24px; padding: 24px; margin-bottom: 24px; }
  h2 { font-size: 14px; margin: 18px 0 8px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 18px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .lbl { font-size: 10px; opacity: 0.6; }
  .amber { color: rgb(245 158 11); display: inline-flex; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; background: rgba(245,158,11,.15); }
  svg { display: block; }
  svg { filter: drop-shadow(0 0 1px rgba(245,158,11,0.6)); }
</style>
</head>
<body>
<div class="dark">
  <h2>OUTLINE GEM — pure strokes, outer edges + inner facet lines (dark)</h2>
  <div class="row">
    <div class="cell"><span class="amber"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h10l4.5 5.5L12 20.5 2.5 9Z"/><path d="M2.5 9h19"/><path d="M10.5 3.5 8 9M13.5 3.5 16 9"/><path d="M8 9l4 11.5L16 9"/></svg></span><span class="lbl">10px</span></div>

    <div class="cell"><span class="amber"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h10l4.5 5.5L12 20.5 2.5 9Z"/><path d="M2.5 9h19"/><path d="M10.5 3.5 8 9M13.5 3.5 16 9"/><path d="M8 9l4 11.5L16 9"/></svg></span><span class="lbl">16px</span></div>
    <div class="cell"><span class="amber"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h10l4.5 5.5L12 20.5 2.5 9Z"/><path d="M2.5 9h19"/><path d="M10.5 3.5 8 9M13.5 3.5 16 9"/><path d="M8 9l4 11.5L16 9"/></svg></span><span class="lbl">32px</span></div>
    <div class="cell"><span class="amber"><svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h10l4.5 5.5L12 20.5 2.5 9Z"/><path d="M2.5 9h19"/><path d="M10.5 3.5 8 9M13.5 3.5 16 9"/><path d="M8 9l4 11.5L16 9"/></svg></span><span class="lbl">64px</span></div>
    <div class="chip"><span class="amber"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h10l4.5 5.5L12 20.5 2.5 9Z"/><path d="M2.5 9h19"/><path d="M10.5 3.5 8 9M13.5 3.5 16 9"/><path d="M8 9l4 11.5L16 9"/></svg></span>Premium</div>
  </div>
</div>

</html>
