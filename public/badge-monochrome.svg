<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Monochrome NW badge for Android status bar.
       Uses bold sans-serif text (not paths) for clean, thick letters.
       White text on transparent background — Android tints it automatically.
       Font-size 110 is very large, fills most of the 192x192 canvas.
       font-weight 900 = extra bold (thickest possible). -->
  <text x="96" y="130" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4">NW</text>
</svg>
