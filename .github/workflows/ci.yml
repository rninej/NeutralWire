name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./db/custom.db"
          # Throwaway key — web-push validates the VAPID env at module
          # load during build. Never used to sign real pushes (the real
          # key lives only in the production environment).
          VAPID_PRIVATE_KEY: "I310FJgYYRdccYGkTb4jhPOzgkbP_qNGrteI1ZmFffI"

      - name: Smoke-test SEO routes
        run: |
          DATABASE_URL="file:./db/custom.db" NODE_ENV=production bun .next/standalone/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/robots.txt >/dev/null && break
            sleep 1
          done
          for path in robots.txt sitemap.xml news-sitemap.xml feed.xml manifest.json; do
            echo "── /$path"
            curl -s -o /dev/null -w '%{http_code}\n' "http://localhost:3000/$path"
          done
          kill $SERVER_PID
